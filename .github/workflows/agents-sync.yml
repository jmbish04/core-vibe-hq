# agents-sync — drop this at .github/workflows/agents-sync.yml in any repo Justin works in.
#
# It pulls the machine-wide agent briefings from jmbish04/colby-ecosystem, right-sized to
# what this repo actually is, and commits them. Because they are committed, a plain
# `git clone` already has them — whoever clones next needs no bootstrap step.
#
# Self-contained on purpose. A reusable workflow living in a PRIVATE repo only works after
# that repo's Actions access is opened to the account; this needs no such setting.
#
# ONE SECRET, set it once per repo:
#   gh secret set COLBY_ECOSYSTEM_TOKEN --repo <owner>/<repo>
# A PAT with read access to jmbish04/colby-ecosystem. The workflow's own GITHUB_TOKEN
# cannot read another repository — that failure arrives as a 404, not a 403, which is why
# pull-agents names the secret in its error.
#
# Value: `tokens show GH_ECOSYSTEM_READ_TOKEN --value-only` if that exists, otherwise
# `tokens show GH_TOKEN --value-only`. A fine-grained PAT with contents:read on
# colby-ecosystem alone is better; it belongs in the tokens CLI only, since no Worker
# reads it and the Cloudflare Secret Store has a hard 100-secret ceiling.

name: agents-sync

# WHEN IT RUNS — on a pull request, never on a push to the default branch and never on a
# schedule (Justin, 2026-10-21; decisions/2026-10-21-agents-sync-fanout.md).
# The old push + weekly cron triggers committed straight to main in every repo, so ONE
# change in colby-ecosystem became an Actions run AND a Workers Build in every repo, and
# every merge anywhere cost an extra run. Now the refreshed briefings are committed to the
# PR's own branch, so they reach main inside a merge that was going to build anyway.
#
# The commit uses GITHUB_TOKEN, and GitHub does not start workflows from a GITHUB_TOKEN
# push, so this cannot loop. A Workers Builds preview build may still run for that push if
# the Worker builds non-production branches.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agents-sync-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    # WHICH RUNNER — decided per repo by an Actions VARIABLE, not by editing this file.
    # GitHub Actions hosted minutes are FREE for public repos and BILLED for private ones,
    # and on this account billing has lapsed: a private repo's job is refused before it
    # starts (measured 2026-10-12 — runner_name "", steps 0, ~3s, annotation "recent
    # account payments have failed"). 8 public repos succeeded and 4 private ones were
    # refused on the same rollout: 100% correlation. So a private repo can only sync on a
    # self-hosted runner.
    #
    # `jmbish04` is a USER account, not an org, so runners are registered PER REPO — there
    # is no org pool. A blanket `runs-on: self-hosted` would therefore SIT QUEUED in any repo
    # without one instead of failing, and a queued job is invisible: strictly worse than one
    # that fails red in 3s. (GitHub's documented usage limits cancel a self-hosted job queued
    # for 24 hours — not measured here, but it is a silent day either way.) Hence the
    # variable, and hence the hosted fallback.
    #
    #   variable absent        -> ubuntu-latest   (today's behaviour; no regression, and it
    #                                              recovers by itself when billing is fixed)
    #   ["self-hosted","Linux","X64","proxmox-actions"]
    #                          -> this repo's own pve-135-<repo> runner
    #
    # `gh-tools agents-sync` / `agents-rollout` is the only writer: it sets the variable
    # where an ONLINE runner exists and DELETES it otherwise, so a repo that loses its
    # runner falls back to hosted instead of sitting queued. The value is machine-generated JSON.
    # A hand-mangled value makes fromJSON throw, which fails the job immediately — loud and
    # visible, which is the failure mode we want over an invisible queue.
    #
    # Measured against GitHub's own expression engine (@actions/expressions 0.3.61):
    # unset -> "ubuntu-latest", empty -> "ubuntu-latest", valid array -> the four labels,
    # malformed -> throws. `&&` short-circuits (evaluator.js visitLogical breaks on a falsy
    # left operand), so fromJSON is never reached when the variable is unset.
    #
    # DO NOT replace this with the fork guard from test.yml:
    #   ${{ github.event.pull_request.head.repo.full_name && … || fromJSON('[…]') }}
    # On workflow_dispatch github.event.pull_request is null, so that guard is falsy and it
    # becomes unconditional self-hosted in disguise — which is exactly what sits queued in
    # a repo with no runner. Forks are handled by the `if:` below instead.
    #
    # A PR from a fork gets no secrets and a read-only token: it can neither pull the
    # briefings nor push to the fork's branch. Skip it rather than fail it red.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.AGENTS_SYNC_RUNNER && fromJSON(vars.AGENTS_SYNC_RUNNER) || 'ubuntu-latest' }}
    steps:
      # A branch name, not the bare SHA: a detached HEAD cannot push. On a pull request
      # that is head_ref (the PR branch); ref_name there is "<n>/merge", which cannot push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Pull the right-sized briefings
        env:
          GH_TOKEN: ${{ secrets.COLBY_ECOSYSTEM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "COLBY_ECOSYSTEM_TOKEN is not set on this repo." >&2
            echo "  gh secret set COLBY_ECOSYSTEM_TOKEN --repo ${{ github.repository }}" >&2
            exit 1
          fi
          gh api repos/jmbish04/colby-ecosystem/contents/scripts/pull-agents \
            --jq .content | base64 -d > /tmp/pull-agents
          bash /tmp/pull-agents --list
          bash /tmp/pull-agents

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f: several repos .gitignore `.agents`, and `git add` then refuses the whole
          # step with exit 1. These files are deliberately committed — a repo-local ignore
          # must not silently defeat the sync. Measured 2026-09-28 on agentic-inbox and
          # core-github-api: both runs died here with "paths are ignored by .gitignore".
          git add -A -f .agents AGENTS.md
          # pull-agents also writes scripts/, and lists everything it owns in MANAGED.
          # `git add -A scripts` would sweep in whatever else the repo keeps there, so
          # the manifest is the precise list — and pull-agents drops any line that is
          # not a real path, because one stray line here fails the run in every repo.
          if [ -s .agents/ecosystem/MANAGED ]; then
            tr '\n' '\0' < .agents/ecosystem/MANAGED | xargs -0 git add -f --
          fi
          if git diff --cached --quiet; then
            echo "briefings already current"
            exit 0
          fi
          git commit -m "chore(agents): sync right-sized briefings from colby-ecosystem"
          # One retry: the branch may have moved while this ran.
          git push || { git pull --rebase -q && git push; }
